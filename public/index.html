<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community People Finder</title>
<style>
  :root { --bg:#fafaf7; --fg:#1c1c1a; --muted:#6b6b66; --card:#fff; --line:#deded8; --accent:#2f5d50; --open:#2f7d4f; --limited:#9a5b00; --off:#8a8a85; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --fg:#ececE6; --muted:#9a9a93; --card:#1f201e; --line:#34352f; --accent:#7fc4ae; --open:#6fcf97; --limited:#e0a458; --off:#9a9a93; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  textarea { width:100%; padding:10px 12px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  button { margin-top:12px; padding:10px 18px; font:inherit; font-weight:600; background:var(--accent); color:var(--bg); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .card { margin-top:16px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .who { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-weight:700; }
  .who a { color:inherit; }
  .tag { font-size:.8rem; font-weight:600; }
  .open { color:var(--open); } .limited { color:var(--limited); } .unavailable, .unknown { color:var(--off); }
  .reason { margin:6px 0; }
  .meta { color:var(--muted); font-size:.9rem; }
  .none { text-align:center; color:var(--muted); }
  .err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>Who in here can help me?</h1>
  <p class="sub" id="status">Ask in plain language. Answers come only from real member profiles on ENS.</p>
  <textarea id="q" rows="3" maxlength="500" placeholder="Is anyone good at Rust and free to mentor this month?"></textarea>
  <button id="go">Find people</button>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const out = $("out");
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}
fetch("/api/status").then((r) => r.json()).then((s) => {
  if (s.indexed !== undefined) $("status").textContent = `${s.community}: ${s.indexed} member profiles read from ENS.`;
}).catch(() => {});

$("go").addEventListener("click", async () => {
  const btn = $("go");
  btn.disabled = true;
  out.replaceChildren(el("p", { class: "sub" }, "Searching…"));
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ question: $("q").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed.");
    if (data.status === "no-match") {
      out.replaceChildren(el("div", { class: "card none" }, data.message));
      return;
    }
    out.replaceChildren(...data.matches.map((m) => {
      const link = el("a", { href: `https://sepolia.app.ens.domains/${encodeURIComponent(m.name)}`, target: "_blank", rel: "noopener" }, m.name);
      return el("div", { class: "card" },
        el("div", { class: "who" }, link, el("span", { class: `tag ${m.availability}` }, m.availability)),
        el("div", { class: "reason" }, m.reason),
        el("div", { class: "meta" }, m.skills.join(" · ")));
    }));
  } catch (e) {
    out.replaceChildren(el("p", { class: "err" }, e.message));
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
